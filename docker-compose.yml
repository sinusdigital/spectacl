version: '3.8'

services:

  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    env_file: '.env.local'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spectacl_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    # AOF persistence — survives unclean shutdowns. Without this, BullMQ jobs,
    # rate-limit counters, and cache state are lost on Redis restart.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10

volumes:
  postgres_data:
  redis_data:
